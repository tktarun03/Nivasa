<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="app-root" content="../../" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="Regional Indian and contemporary interior styles." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Design styles · Nivasa</title>
  </head>
  <body data-page="styles">
    <main id="main" tabindex="-1">
      <div class="container page-head">
        <p class="eyebrow">Design styles</p>
        <h1>Regional Indian and contemporary styles</h1>
        <p class="lede">Inspiration for how a space looks and feels. Styles are not engineering or building-code categories.</p>
      </div>
      <div class="container">
        <div class="scope-bar" role="group" aria-label="Filter styles" id="style-scope" style="margin-bottom:24px"></div>
        <div class="list-grid" id="style-list" data-reveal-group></div>
      </div>
      <noscript><div class="container"><p class="callout">This app needs JavaScript to search, filter and save designs.</p></div></noscript>
    </main>
    <script type="module" src="/src/js/pages/styles.js"></script>
  </body>
</html>
