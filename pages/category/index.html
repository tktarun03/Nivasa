<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="app-root" content="../../" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="Interior designs in this category." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Category · Nivasa</title>
  </head>
  <body data-page="category">
    <main id="main" tabindex="-1">
      <div class="container page-head" id="cat-head">
        <p class="eyebrow" id="cat-group">Category</p>
        <h1 id="cat-title">Loading…</h1>
        <p class="lede" id="cat-desc"></p>
      </div>
      <div class="container">
        <div class="chip-row" id="cat-related" style="margin-bottom:24px"></div>
        <div class="design-grid" id="results" data-reveal-group></div>
        <div id="results-footer"></div>
      </div>
      <noscript><div class="container"><p class="callout">This app needs JavaScript to search, filter and save designs.</p></div></noscript>
    </main>
    <script type="module" src="/src/js/pages/category.js"></script>
  </body>
</html>
